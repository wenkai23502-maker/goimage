<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網站 | 首頁</title>
    <style>
        /* --- 全域設定與變數 --- */
        :root {
            --primary-color: #5B6B61; /* 柔和的墨綠色 */
            --bg-color: #F8F6F0; /* 和紙般的米白色 */
            --text-color: #333333;
            --accent-color: #C07953; /* 磚紅色點綴 */
            --border-color: #D3CDC1;
            --font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif; /* 偏好襯線體營造和風 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- 導覽列 (全站通用) --- */
        header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            writing-mode: vertical-lr; /* 日式直排巧思 */
            letter-spacing: 5px;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 3rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            position: relative;
            padding-bottom: 5px;
            transition: color 0.3s;
        }

        nav a::after {
            content: '';
            position: absolute;
            width: 0;
            height: 1px;
            bottom: 0;
            left: 0;
            background-color: var(--accent-color);
            transition: width 0.3s ease;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        nav a:hover::after {
            width: 100%;
        }

        /* 當前頁面標示 */
        nav a.active {
            color: var(--accent-color);
        }
        nav a.active::after {
            width: 100%;
        }

        /* --- 主要內容區塊 --- */
        main {
            flex: 1;
            padding: 4rem 5%;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* --- 首頁特定樣式 --- */
        .hero {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4rem;
        }

        .hero-text {
            flex: 1;
        }

        .hero-text h1 {
            font-size: 3rem;
            font-weight: normal;
            margin-bottom: 1rem;
            color: var(--primary-color);
        }

        .hero-text h2 {
            font-size: 1.2rem;
            font-weight: normal;
            margin-bottom: 2rem;
            color: #666;
        }

        .hero-text p {
            font-size: 1rem;
            max-width: 500px;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            padding: 10px 30px;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            text-decoration: none;
            transition: all 0.3s;
            font-size: 0.9rem;
        }

        .btn:hover {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        .hero-image {
            flex: 1;
            position: relative;
        }
        
        /* 使用 CSS 繪製一個日式風格的裝飾框 */
        .hero-image::before {
            content: '';
            position: absolute;
            top: -20px;
            left: 20px;
            width: 100%;
            height: 100%;
            border: 1px solid var(--accent-color);
            z-index: -1;
        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 3/4; /* 日式常見比例 */
            background-color: #e0e0e0; /* 圖片載入前的底色 */
        }

        /* --- 頁尾 (全站通用) --- */
        footer {
            text-align: center;
            padding: 2rem;
            font-size: 0.8rem;
            color: #888;
            border-top: 1px solid var(--border-color);
        }

        /* --- 響應式設計 --- */
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1.5rem;
            }
            .logo {
                writing-mode: horizontal-tb; /* 手機版改回橫排 */
                letter-spacing: 2px;
            }
            .hero {
                flex-direction: column-reverse;
            }
            .hero-text h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- 共用導覽列 -->
    <header>
        <a href="index.html" class="logo">作品集</a>
        <nav>
            <ul>
                <li><a href="index.html" class="active">首頁</a></li>
                <li><a href="about.html">關於</a></li>
                <li><a href="portfolio.html">作品</a></li>
            </ul>
        </nav>
    </header>

    <!-- 頁面主要內容 -->
    <main>
        <section class="hero">
            <div class="hero-text">
                <h1>設計、<br>與生活的交織。</h1>
                <h2>視覺設計師 / 攝影愛好者</h2>
                <p>你好，我是一名熱愛簡約美學的創作者。致力於在細節中尋找平衡，將日常的靈感轉化為靜謐而有力量的視覺作品。歡迎來到我的個人空間。</p>
                <a href="./images/45.jpg" class="btn">瀏覽作品</a>
            </div>
            <div class="hero-image">
                <!-- 使用 placehold.co 作為範例圖片，實際使用時請替換為您自己的圖片 -->
                <img src="./images/ChatGPT Image 2026年8月7日 11_39_02 (1).png" alt="個人風格代表圖">
            </div>
        </section>
    </main>

    <!-- 共用頁尾 -->
    <footer>
        <p>&copy; 2026 Your Name. All rights reserved.</p>
    </footer>

</body>
</html>
