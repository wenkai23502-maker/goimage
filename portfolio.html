<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人網站 | 作品集</title>
    <style>
        /* --- 全域設定與變數 (與前面相同) --- */
        :root {
            --primary-color: #5B6B61;
            --bg-color: #F8F6F0;
            --text-color: #333333;
            --accent-color: #C07953;
            --border-color: #D3CDC1;
            --font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.8;
            letter-spacing: 1px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* --- 導覽列 --- */
        header { padding: 2rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); text-decoration: none; writing-mode: vertical-lr; letter-spacing: 5px; }
        nav ul { list-style: none; display: flex; gap: 3rem; }
        nav a { text-decoration: none; color: var(--text-color); font-size: 0.9rem; position: relative; padding-bottom: 5px; transition: color 0.3s; }
        nav a::after { content: ''; position: absolute; width: 0; height: 1px; bottom: 0; left: 0; background-color: var(--accent-color); transition: width 0.3s ease; }
        nav a:hover { color: var(--accent-color); }
        nav a:hover::after { width: 100%; }
        nav a.active { color: var(--accent-color); }
        nav a.active::after { width: 100%; }
        
        main { flex: 1; padding: 4rem 5%; max-width: 1200px; margin: 0 auto; width: 100%; }
        footer { text-align: center; padding: 2rem; font-size: 0.8rem; color: #888; border-top: 1px solid var(--border-color); }

        /* --- 作品集特定樣式 --- */
        .page-title {
            text-align: center;
            margin-bottom: 4rem;
            font-weight: normal;
            color: var(--primary-color);
            position: relative;
            display: inline-block;
            left: 50%;
            transform: translateX(-50%);
        }

        .page-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 1px;
            background-color: var(--accent-color);
        }

        /* 網格佈局 */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 3rem 2rem;
        }

        .portfolio-item {
            display: block;
            text-decoration: none;
            color: inherit;
            group;
        }

        .portfolio-img-container {
            width: 100%;
            overflow: hidden;
            margin-bottom: 1rem;
            position: relative;
        }

        .portfolio-img-container img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        /* 懸停時的圖片放大效果 */
        .portfolio-item:hover .portfolio-img-container img {
            transform: scale(1.05);
        }

        .portfolio-info h4 {
            font-size: 1.1rem;
            font-weight: normal;
            margin-bottom: 0.3rem;
            color: var(--text-color);
            transition: color 0.3s;
        }

        .portfolio-info p {
            font-size: 0.85rem;
            color: #888;
        }

        .portfolio-item:hover .portfolio-info h4 {
            color: var(--accent-color);
        }

        /* --- 響應式設計 --- */
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 1.5rem; }
            .logo { writing-mode: horizontal-tb; letter-spacing: 2px; }
            .portfolio-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
